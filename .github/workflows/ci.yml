name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 1. Install dependencies
        run: npm ci

      - name: 2. Typecheck
        run: npm run typecheck

      - name: 3. Lint & Import Boundaries
        run: npm run lint

      - name: 4. COST FIREWALL (SR-10.1 - SR-10.4)
        run: npm run check:firewall

      - name: 5. Tests (Cost Firewall, Privacy Canary, Evidence Ladder)
        run: npm test

      - name: 6. Documentation & Invariant Checks
        run: ./scripts/check-docs.sh
